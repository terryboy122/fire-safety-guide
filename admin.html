<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>留言管理｜防火情報站</title>
<style>
  :root{ --bg:#ffffff; --surface:#ffffff; --ink:#1c1917; --ink-2:#44403c; --muted:#78716c; --line:#e7ddd5; --red:#c81e1e; --red-soft:#fdecec; --shadow:0 10px 30px rgba(28,25,23,.08); --radius:14px; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161211; --surface:#201b18; --ink:#f5f0eb; --ink-2:#d6cec7; --muted:#a89e96; --line:#3a322c; --red:#f97066; --red-soft:#3a1f1c; --shadow:0 10px 30px rgba(0,0,0,.4); }
  }
  body{ margin:0; font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; }
  .wrap{ max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1{ font-size:26px; margin:0 0 8px; }
  .note{ color:var(--muted); margin:0 0 24px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px; }
  label{ display:block; margin-bottom:6px; font-weight:600; }
  input[type="password"], input[type="text"], select{ width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; margin-bottom:12px; }
  .site-badge{ display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; border:1.5px solid var(--line); color:var(--muted); margin-right:8px; white-space:nowrap; }
  .btn{ display:inline-block; font:inherit; font-weight:700; border:0; cursor:pointer; background:var(--red); color:#fff; padding:11px 22px; border-radius:10px; font-size:15px; }
  .btn.secondary{ background:var(--surface); color:var(--ink); border:1.5px solid var(--line); }
  .btn.danger{ background:var(--surface); color:var(--red); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .status{ color:var(--muted); margin:12px 0 0; }
  .status.err{ color:var(--red); }
  .msg{ border-top:1px solid var(--line); padding:16px 0; }
  .msg:first-child{ border-top:0; padding-top:0; }
  .msg-head{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .msg-name{ font-weight:700; }
  .msg-time{ color:var(--muted); font-size:13px; white-space:nowrap; }
  .msg-body{ white-space:pre-wrap; word-break:break-word; margin:8px 0 0; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  a{ color:var(--red); }
  .stats{ margin-bottom:16px; }
  .stat-row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
  .stat-row:last-child{ border-bottom:0; }
  .stat-label{ color:var(--muted); }
  .stat-value{ font-weight:700; text-align:right; }
  .msg-head{ flex-wrap:wrap; row-gap:4px; }
  .msg .btn.danger{ margin-top:12px; padding:8px 18px; font-size:14px; }
  @media (max-width:700px){
    .msg-head{ flex-direction:column; align-items:flex-start; }
    .msg-time{ white-space:normal; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>留言管理</h1>
  <p class="note">此頁沒有在公開網站上連結，僅供管理員使用。留言內容不會公開顯示，只有登入後才看得到。</p>

  <div id="setup-box" class="card" hidden>
    <h2 style="margin-top:0">第一次使用：設定管理密碼</h2>
    <p class="note">請設定一組 8 字以上的管理密碼，設定後只有知道密碼的人才能看留言。密碼只會以雜湊形式存放，不會以明文保存。</p>
    <label for="setup-pw">管理密碼</label>
    <input id="setup-pw" type="password" autocomplete="new-password">
    <label for="setup-pw2">再輸入一次</label>
    <input id="setup-pw2" type="password" autocomplete="new-password">
    <button id="setup-btn" class="btn" type="button">設定密碼</button>
    <p id="setup-status" class="status"></p>
  </div>

  <div id="login-box" class="card" hidden>
    <h2 style="margin-top:0">管理員登入</h2>
    <label for="login-pw">管理密碼</label>
    <input id="login-pw" type="password" autocomplete="current-password">
    <button id="login-btn" class="btn" type="button">登入</button>
    <p id="login-status" class="status"></p>
  </div>

  <div id="list-box" hidden>
    <div class="row" style="margin-bottom:16px">
      <button id="logout-btn" class="btn secondary" type="button">登出</button>
      <button id="change-toggle" class="btn secondary" type="button">更改密碼</button>
      <a href="https://fire-safety-guide.pages.dev/">回防火情報站</a>
      <a href="https://elder-safety-guide.pages.dev/">回長輩居家站</a>
    </div>
    <div id="change-box" class="card" hidden>
      <h2 style="margin-top:0">更改密碼</h2>
      <label for="old-pw">目前密碼</label>
      <input id="old-pw" type="password" autocomplete="current-password">
      <label for="new-pw">新密碼（8 字以上）</label>
      <input id="new-pw" type="password" autocomplete="new-password">
      <button id="change-btn" class="btn" type="button">確認更改</button>
      <p id="change-status" class="status"></p>
    </div>
    <div class="card">
      <h2 style="margin-top:0">雲端備份</h2>
      <p class="note">把留言、推播訂閱備份到雲端（R2），只保留最新 3 筆，舊備份會自動刪除。</p>
      <div class="row">
        <button id="backup-btn" class="btn" type="button">備份到雲端</button>
      </div>
      <p id="backup-status" class="status"></p>
      <div id="backup-list"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">收到的留言</h2>
      <div id="stats-box" class="stats"></div>
      <div class="row" style="margin-bottom:12px">
        <label for="site-filter" style="margin-bottom:0">顯示：</label>
        <select id="site-filter" style="width:auto;margin-bottom:0">
          <option value="all">全部站台</option>
          <option value="fire-safety-guide">防火情報站</option>
          <option value="elder-safety-guide">長輩居家安全</option>
        </select>
      </div>
      <div id="msg-list"></div>
      <p id="list-status" class="status"></p>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY = 'fire-board-admin-pw';
  function $(id){ return document.getElementById(id); }
  function show(el, yes){ el.hidden = !yes; }
  function setStatus(el, text, isErr){
    el.textContent = text;
    el.className = 'status' + (isErr ? ' err' : '');
  }
  function getPw(){ return sessionStorage.getItem(KEY) || ''; }
  function authHeaders(){
    return { 'Authorization': 'Bearer ' + getPw() };
  }
  function loadList(){
    setStatus($('list-status'), '載入中…');
    var sf = $('site-filter') ? $('site-filter').value : 'all';
    var q = (sf && sf !== 'all') ? '?site=' + encodeURIComponent(sf) : '';
    fetch('/api/admin/messages' + q, { headers: authHeaders() })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if(!res.ok || !res.d.ok){
          if(res.d && res.d.error === 'auth'){ setStatus($('list-status'), '密碼不正確，請重新登入。', true); doLogout(); }
          else { setStatus($('list-status'), '載入失敗，請稍後再試。', true); }
          return;
        }
        var list = $('msg-list');
        list.textContent = '';
        var msgs = res.d.messages || [];
        var st = res.d.stats || { count: msgs.length, bytes: 0 };
        var mb = st.bytes;
        var msize = mb < 1024 ? mb + ' 位元組' : (mb < 1048576 ? (mb / 1024).toFixed(1) + ' KB' : (mb / 1048576).toFixed(2) + ' MB');
        var stats = { files: '計算中…', elderFiles: '計算中…', msgs: '', push: '—' };
        if (sf && sf !== 'all') {
          stats.msgs = st.count + ' 則' + (st.count > 0 ? '（內容約 ' + msize + '）' : '');
        } else {
          var bySite = st.bySite || {};
          var siteNames = { 'fire-safety-guide': '防火情報站', 'elder-safety-guide': '長輩居家安全' };
          var parts = [];
          ['fire-safety-guide', 'elder-safety-guide'].forEach(function(s){ if (bySite[s] !== undefined) parts.push(siteNames[s] + ' ' + bySite[s] + ' 則'); });
          Object.keys(bySite).forEach(function(s){ if (s !== 'fire-safety-guide' && s !== 'elder-safety-guide') parts.push(s + ' ' + bySite[s] + ' 則'); });
          stats.msgs = '共 ' + st.count + ' 則' + (parts.length ? '（' + parts.join('、') + '）' : '');
        }
        var statsBox = $('stats-box');
        function renderStats(){
          statsBox.textContent = '';
          var rows = [
            ['防火站檔案', stats.files],
            ['長輩站檔案', stats.elderFiles],
            ['留言', stats.msgs],
            ['推播訂閱（防火站）', stats.push]
          ];
          rows.forEach(function(r){
            var row = document.createElement('div');
            row.className = 'stat-row';
            var lab = document.createElement('span');
            lab.className = 'stat-label';
            lab.textContent = r[0];
            var val = document.createElement('span');
            val.className = 'stat-value';
            val.textContent = r[1];
            row.appendChild(lab);
            row.appendChild(val);
            statsBox.appendChild(row);
          });
        }
        renderStats();
        fetch('/api/admin/push-stats', { headers: authHeaders() })
          .then(function(r){ return r.json(); })
          .then(function(d){ if(d.ok){ stats.push = d.count + ' 人'; renderStats(); } })
          .catch(function(){});
        fetch('https://api.github.com/repos/terryboy122/fire-safety-guide/git/trees/main?recursive=1')
          .then(function(r){ return r.json(); })
          .then(function(t){
            var total = 0;
            (t.tree || []).forEach(function(n){ if(n.type === 'blob' && typeof n.size === 'number'){ total += n.size; } });
            var fsize = total < 1024 ? total + ' 位元組' : (total < 1048576 ? (total / 1024).toFixed(1) + ' KB' : (total / 1048576).toFixed(2) + ' MB');
            stats.files = '約 ' + fsize;
            renderStats();
          })
          .catch(function(){ stats.files = '無法取得'; renderStats(); });
        fetch('https://api.github.com/repos/terryboy122/elder-safety-guide/git/trees/main?recursive=1')
          .then(function(r){ return r.json(); })
          .then(function(t){
            var total = 0;
            (t.tree || []).forEach(function(n){ if(n.type === 'blob' && typeof n.size === 'number'){ total += n.size; } });
            var fsize = total < 1024 ? total + ' 位元組' : (total < 1048576 ? (total / 1024).toFixed(1) + ' KB' : (total / 1048576).toFixed(2) + ' MB');
            stats.elderFiles = '約 ' + fsize;
            renderStats();
          })
          .catch(function(){ stats.elderFiles = '無法取得'; renderStats(); });
        if(msgs.length === 0){
          var empty = document.createElement('p');
          empty.className = 'status';
          empty.textContent = '目前還沒有留言。';
          list.appendChild(empty);
          setStatus($('list-status'), '');
          return;
        }
        msgs.forEach(function(m){
          var item = document.createElement('div');
          item.className = 'msg';
          var head = document.createElement('div');
          head.className = 'msg-head';
          var badge = document.createElement('span');
          badge.className = 'site-badge';
          badge.textContent = m.site === 'elder-safety-guide' ? '長輩居家安全' : '防火情報站';
          var name = document.createElement('span');
          name.className = 'msg-name';
          name.textContent = m.name;
          var time = document.createElement('span');
          time.className = 'msg-time';
          time.textContent = new Date(m.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
          head.appendChild(badge);
          head.appendChild(name);
          head.appendChild(time);
          var body = document.createElement('p');
          body.className = 'msg-body';
          body.textContent = m.message;
          var del = document.createElement('button');
          del.className = 'btn danger';
          del.type = 'button';
          del.textContent = '刪除';
          del.addEventListener('click', function(){
            if(!window.confirm('確定要刪除這則留言嗎？')) return;
            fetch('/api/admin/messages?id=' + m.id, { method: 'DELETE', headers: authHeaders() })
              .then(function(){ loadList(); });
          });
          item.appendChild(head);
          item.appendChild(body);
          item.appendChild(del);
          list.appendChild(item);
        });
        setStatus($('list-status'), '');
      })
      .catch(function(){ setStatus($('list-status'), '載入失敗，請檢查網路後再試。', true); });
  }
  function doLogout(){
    sessionStorage.removeItem(KEY);
    show($('list-box'), false);
    show($('login-box'), true);
    $('login-pw').value = '';
  }
  $('setup-btn').addEventListener('click', function(){
    var pw = $('setup-pw').value;
    var pw2 = $('setup-pw2').value;
    if(pw.length < 8){ setStatus($('setup-status'), '密碼至少要 8 字。', true); return; }
    if(pw !== pw2){ setStatus($('setup-status'), '兩次輸入的密碼不一樣。', true); return; }
    $('setup-btn').disabled = true;
    fetch('/api/admin/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        $('setup-btn').disabled = false;
        if(res.ok && res.d.ok){
          sessionStorage.setItem(KEY, pw);
          show($('setup-box'), false);
          show($('list-box'), true);
          loadList();
          loadBackupList();
        } else if(res.d && res.d.error === 'already'){
          setStatus($('setup-status'), '已經設定過密碼了，請直接登入。', true);
          show($('setup-box'), false);
          show($('login-box'), true);
        } else {
          setStatus($('setup-status'), '設定失敗，請稍後再試。', true);
        }
      })
      .catch(function(){ $('setup-btn').disabled = false; setStatus($('setup-status'), '設定失敗，請檢查網路後再試。', true); });
  });
  $('login-btn').addEventListener('click', function(){
    var pw = $('login-pw').value;
    if(!pw){ setStatus($('login-status'), '請輸入密碼。', true); return; }
    sessionStorage.setItem(KEY, pw);
    show($('login-box'), false);
    show($('list-box'), true);
    loadList();
    loadBackupList();
  });
  $('login-pw').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ $('login-btn').click(); }
  });
  function fmtSize(b){
    return b < 1024 ? b + ' 位元組' : (b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB');
  }
  function loadBackupList(){
    var box = $('backup-list');
    if(!box) return;
    fetch('/api/admin/backups', { headers: authHeaders() })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        box.textContent = '';
        if(!res.ok || !res.d.ok){
          if(res.d && res.d.error === 'auth'){ doLogout(); }
          return;
        }
        var items = res.d.backups || [];
        if(items.length === 0){
          var empty = document.createElement('p');
          empty.className = 'status';
          empty.textContent = '還沒有備份，按「備份到雲端」建立第一筆。';
          box.appendChild(empty);
          return;
        }
        items.forEach(function(b){
          var row = document.createElement('div');
          row.className = 'stat-row';
          var lab = document.createElement('span');
          lab.className = 'stat-label';
          lab.textContent = new Date(b.uploaded).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
          var val = document.createElement('span');
          val.className = 'stat-value';
          val.textContent = fmtSize(b.size);
          row.appendChild(lab);
          row.appendChild(val);
          box.appendChild(row);
        });
      })
      .catch(function(){});
  }
  $('backup-btn').addEventListener('click', function(){
    setStatus($('backup-status'), '備份中…');
    $('backup-btn').disabled = true;
    fetch('/api/admin/backup', { method: 'POST', headers: authHeaders() })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        $('backup-btn').disabled = false;
        if(res.ok && res.d.ok){
          setStatus($('backup-status'), '備份完成：' + res.d.key + '（留言 ' + res.d.counts.messages + ' 則、推播訂閱 ' + res.d.counts.subscriptions + ' 人）' + (res.d.deleted ? '（已刪除 ' + res.d.deleted + ' 筆舊備份）' : ''));
          loadBackupList();
        } else if(res.d && res.d.error === 'auth'){ setStatus($('backup-status'), '密碼不正確，請重新登入。', true); doLogout(); }
        else if(res.d && res.d.error === 'not_configured'){ setStatus($('backup-status'), '尚未綁定雲端備份空間，請先完成 R2 綁定再試。', true); }
        else { setStatus($('backup-status'), '備份失敗，請稍後再試。', true); }
      })
      .catch(function(){ $('backup-btn').disabled = false; setStatus($('backup-status'), '備份失敗，請檢查網路後再試。', true); });
  });
  $('site-filter').addEventListener('change', loadList);
  $('logout-btn').addEventListener('click', doLogout);
  $('change-toggle').addEventListener('click', function(){
    show($('change-box'), $('change-box').hidden);
  });
  $('change-btn').addEventListener('click', function(){
    var oldPw = $('old-pw').value;
    var newPw = $('new-pw').value;
    if(newPw.length < 8){ setStatus($('change-status'), '新密碼至少要 8 字。', true); return; }
    fetch('/api/admin/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + oldPw }, body: JSON.stringify({ new_password: newPw }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if(res.ok && res.d.ok){
          sessionStorage.setItem(KEY, newPw);
          setStatus($('change-status'), '密碼已更改。');
          $('old-pw').value = '';
          $('new-pw').value = '';
        } else {
          setStatus($('change-status'), '更改失敗，請確認目前密碼是否正確。', true);
        }
      })
      .catch(function(){ setStatus($('change-status'), '更改失敗，請檢查網路後再試。', true); });
  });
  fetch('/api/admin/status')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok && d.setup_needed){ show($('setup-box'), true); }
      else { show($('login-box'), true); }
    })
    .catch(function(){ show($('login-box'), true); });
})();
</script>
</body>
</html>
